# Local infrastructure for DASH AND DOT Manufacturing ERP.
#
#   docker compose -f docker/docker-compose.yml up -d
#
# Postgres is pinned to 16 because the schema relies on partial unique indexes
# and NUMERIC arithmetic behaviour that must not change under the application.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dnd-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: dnd
      POSTGRES_DB: dnd_erp
      # Deterministic collation, so ORDER BY on SKUs is stable across machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - dnd-pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dnd -d dnd_erp']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: dnd-erp-redis
    restart: unless-stopped
    # appendonly keeps queued background jobs across a restart; losing a
    # queued inventory push would be worse than a slow restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - dnd-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for product images, QC photos and documents.
  minio:
    image: minio/minio:latest
    container_name: dnd-erp-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: dndminio
      MINIO_ROOT_PASSWORD: dndminio123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - dnd-miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dnd-pgdata:
  dnd-redisdata:
  dnd-miniodata:
